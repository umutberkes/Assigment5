name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - run: deno fmt --check
      - run: deno lint
      - run: deno task check
      - run: deno task test
      - run: deno task evidence:live
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, start and verify persistent data
        run: |
          set -o pipefail
          sh scripts/docker_smoke.sh 2>&1 | tee docker-evidence.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evidence
          path: docker-evidence.txt
